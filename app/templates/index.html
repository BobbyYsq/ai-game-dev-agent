<!doctype html><html><head><meta charset='utf-8'><title>AI Game Development Agent</title><link rel='stylesheet' href='/static/css/app.css'></head><body><h1>AI Game Development Agent</h1>
<section><h2>Settings Panel</h2><label>LLM Provider <select id='provider'><option value='mock'>mock</option><option value='openai'>openai</option></select></label><label>OpenAI Model <input id='model' value='gpt-4.1-mini'></label><label>OpenAI API Key <input id='apiKey' type='password'></label><button onclick='saveSettings()'>Save Settings</button><button onclick='testLLM()'>Test Connection</button><span id='apiKeyStatus'></span></section>
<section><h2>Project Panel</h2><input id='project_name' value='Shadow Garden'><textarea id='game_idea'>A 2D top-down action prototype in a haunted garden.</textarea><select id='project_template'><option value='2d'>2D Game Prototype</option><option value='3d'>3D Game Prototype</option></select><input id='game_type' value='2D top-down action'><input id='engine' value='Godot 4'><input id='prototype_scope' value='vertical slice'><label><input id='enable_git' type='checkbox' checked> Enable Git</label><label><input id='generate_docs' type='checkbox' checked> Generate Documentation</label><label><input id='generate_godot_skeleton' type='checkbox' checked> Generate Godot Prototype</label><button onclick='createProject()'>Create AI Game Project</button></section>
<section><h2>Recent Projects Panel</h2><ul id='recent_projects'></ul></section><pre id='output'></pre><script src='/static/js/app.js'></script></body></html>
